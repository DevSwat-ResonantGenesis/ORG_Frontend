name: Deploy Frontend to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for production
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_URL: http://dev-swat.com
          VITE_WS_URL: ws://dev-swat.com/ws
          VITE_GRAFANA_URL: http://dev-swat.com/grafana
          VITE_PROMETHEUS_URL: http://dev-swat.com/prometheus
          VITE_ALERTMANAGER_URL: http://dev-swat.com/alertmanager
          VITE_AGENT_ENGINE_URL: http://dev-swat.com/agent-engine
          VITE_RARA_URL: http://dev-swat.com/rara
          VITE_HASH_SPHERE_URL: http://dev-swat.com/hash-sphere

      - name: Deploy to Droplet
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "dist/*"
          target: "/root/genesis2026_production_backend/frontend_dist"
          strip_components: 1
          overwrite: true

      - name: Restart Nginx
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            echo "🚀 Deploying frontend to production..."
            
            cd /root/genesis2026_production_backend
            
            echo "♻️  Restarting nginx to load new frontend..."
            docker-compose restart nginx
            
            echo "⏳ Waiting for nginx to restart..."
            sleep 5
            
            echo "✅ Frontend deployed successfully at $(date)"
            echo "🌐 Frontend available at http://dev-swat.com"

      - name: Health Check
        run: |
          echo "🏥 Running health checks..."
          sleep 5
          
          curl -f http://137.184.234.252/ || exit 1
          echo "✅ Frontend health check passed"
          
          curl -f http://137.184.234.252/health || exit 1
          echo "✅ API health check passed"
