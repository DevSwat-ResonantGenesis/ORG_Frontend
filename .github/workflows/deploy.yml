name: Frontend Deploy (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: frontend-deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Archive dist
        run: |
          tar -czf dist.tgz dist

      - name: Upload dist archive
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist.tgz

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Copy dist.tgz to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "dist.tgz"
          target: "/tmp"

      - name: Deploy on droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            TS=$(date +%Y%m%d_%H%M%S)
            BK_DIR=/var/backups/frontend
            sudo -n mkdir -p "$BK_DIR"

            if [ -d /var/www/frontend ]; then
              sudo -n tar -C /var/www -czf "$BK_DIR/frontend_${TS}.tgz" frontend
            fi

            sudo -n rm -rf /tmp/frontend_new
            sudo -n mkdir -p /tmp/frontend_new
            sudo -n tar -C /tmp/frontend_new -xzf /tmp/dist.tgz

            sudo -n rsync -a --delete /tmp/frontend_new/dist/ /var/www/frontend/
            sudo -n chown -R www-data:www-data /var/www/frontend
            sudo -n find /var/www/frontend -type d -exec chmod 755 {} \;
            sudo -n find /var/www/frontend -type f -exec chmod 644 {} \;

            sudo -n nginx -t
            sudo -n systemctl reload nginx

            curl -fsS https://resonantgenesis.xyz/ > /dev/null
            echo "Frontend deployed"
