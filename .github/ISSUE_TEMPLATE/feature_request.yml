name: ✨ Frontend Feature Request
description: Request a new frontend feature or UI enhancement
title: "[FEATURE-FRONTEND] "
labels: ["enhancement", "frontend", "needs-review"]

body:
  - type: markdown
    attributes:
      value: |
        ## Frontend Feature Request
        Propose a new frontend feature or UI enhancement.
        
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - High - Critical for users
        - Medium - Important but not urgent
        - Low - Nice to have
    validations:
      required: true

  - type: dropdown
    id: feature-type
    attributes:
      label: Feature Type
      description: What type of feature is this?
      options:
        - New Page/View
        - New Component
        - UI/UX Improvement
        - Performance Enhancement
        - Accessibility Improvement
        - Mobile Enhancement
        - Animation/Interaction
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What user problem does this solve?
      placeholder: Describe the user need or pain point
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work from a user perspective?
      placeholder: Describe the user experience
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Design/Mockup
      description: Any design mockups or wireframes?
      placeholder: Attach images or link to design files

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other UI/UX approaches did you consider?
      placeholder: List alternative approaches

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How do we know this is complete?
      placeholder: |
        - [ ] Feature renders correctly on desktop
        - [ ] Feature works on mobile
        - [ ] No console errors
        - [ ] Accessible (keyboard navigation, screen readers)
        - [ ] Performance impact minimal

  - type: checkboxes
    id: implementation
    attributes:
      label: Implementation Considerations
      options:
        - label: Requires new API endpoints
        - label: Requires state management changes
        - label: Requires new dependencies
        - label: Requires design system updates
        - label: Requires documentation updates
        - label: Affects mobile experience
        - label: Affects accessibility

  - type: dropdown
    id: browsers
    attributes:
      label: Browser Support Required
      description: Which browsers must this support?
      options:
        - All modern browsers (Chrome, Firefox, Safari, Edge)
        - Desktop only
        - Mobile priority
      multiple: false

  - type: checkboxes
    id: ai-agent-safe
    attributes:
      label: AI Agent Assignment
      description: Can an AI agent work on this?
      options:
        - label: Safe for AI agent to implement
        - label: Requires human design review first
        - label: Requires human code review before merge
        - label: Requires UX testing before deployment
